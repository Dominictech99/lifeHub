<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Onboarding — LifeHub</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .dash{max-width:760px;margin:0 auto;padding:28px 20px 90px}
  [hidden]{display:none !important}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px}
  .auth-card{max-width:420px;margin:40px auto}
  .auth-card h1{font-size:26px;margin-bottom:6px}
  .sub{color:var(--text-mute);margin-bottom:22px;font-size:15px;line-height:1.55}
  .auth-card .btn{width:100%;margin-top:6px;padding:14px;font-size:16px}
  .form-error{background:#FDEDED;color:#B4232C;font-size:14px;padding:10px 14px;border-radius:8px;margin-bottom:16px}
  .form-ok{background:var(--leaf-soft);color:var(--leaf);font-size:14px;padding:10px 14px;border-radius:8px;margin-bottom:16px}
  .dash-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .dash-top h1{font-size:26px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 16px;font:600 15px 'Inter',sans-serif;color:var(--text-mute);cursor:pointer}
  .tab.active{color:var(--ink);border-bottom-color:var(--marigold)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{text-align:center;padding:16px 8px}
  .stat b{display:block;font:700 28px 'Space Grotesk',sans-serif;color:var(--ink)}
  .stat span{font-size:13px;color:var(--text-mute)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row b{color:var(--ink);font-size:15.5px}
  .row small{display:block;color:var(--text-mute);font-size:13px;margin-top:2px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px}
  .pill.live{background:var(--leaf-soft);color:var(--leaf)}
  .pill.pending{background:rgba(245,166,35,.18);color:var(--marigold-deep)}
  .pill.rejected{background:#FDEDED;color:#B4232C}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .empty{color:var(--text-mute);text-align:center;padding:36px 16px;font-size:15px;line-height:1.6}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
  .photo-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--leaf-soft)}
  .photo-item img{width:100%;height:100%;object-fit:cover}
  .photo-item button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(27,42,74,.85);color:#fff;cursor:pointer}
  #addForm .btn{width:100%;padding:14px;font-size:16px}
  @media (max-width:520px){.grid3{gap:8px}.stat b{font-size:24px}}
</style>
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="logo"><img src="logo-mark.png" alt="" class="logo-img">LifeHub</a>
    
  </div>
</header>

<main class="dash">
  <p id="viewLoading" class="empty">Loading…</p>

  <section id="viewLogin" class="card auth-card" hidden>
    <h1>Onboarding login</h1>
    <p class="sub">For LifeHub team members who sign artisans up.</p>
    <div id="loginError" class="form-error" hidden></div>
    <form id="loginForm" novalidate>
      <div class="form-group"><label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required></div>
      <div class="form-group"><label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </section>

  <section id="viewApp" hidden>
    <div class="dash-top"><h1 id="hello">Onboarding</h1><button class="btn btn-small" id="logoutBtn" type="button">Log out</button></div>
    <div class="grid3">
      <div class="card stat"><b id="stMine">0</b><span>Artisans you added</span></div>
      <div class="card stat"><b id="stLive">0</b><span>Approved</span></div>
      <div class="card stat"><b id="stSpots">–</b><span>Founding spots left</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="add">Add artisan</button>
      <button class="tab" data-tab="list">My artisans</button>
      <button class="tab" data-tab="others">Send setup links</button>
    </div>

    <section id="tabAdd" class="card">
      <div id="addMsg" hidden></div>
      <form id="addForm" novalidate>
        <div class="form-group"><label for="fName">Full name</label><input type="text" id="fName" autocomplete="off"></div>
        <div class="form-group"><label for="fPhone">Phone / WhatsApp number</label><input type="tel" id="fPhone" placeholder="080X XXX XXXX" autocomplete="off"></div>
        <div class="form-group"><label for="fTrade">Trade</label>
          <select id="fTrade"><option value="" disabled selected>Choose</option>
            <option>Carpenter</option><option>Electrician</option><option>Plumber</option><option>Tailor</option>
            <option>Mechanic</option><option>Painter</option><option>Hairstylist</option><option>Crochet/Crafts</option>
            <option>Laptop sales &amp; repairs</option><option>Typing &amp; printing</option><option value="__other">Other…</option></select></div>
        <div class="form-group" id="otherWrap" hidden><label for="fOther">Their trade</label><input type="text" id="fOther"></div>
        <div class="form-group"><label for="fArea">Area in Lagos</label><input type="text" id="fArea" placeholder="e.g. Ikeja"></div>
        <div class="form-group"><label for="fYears">Years of experience</label>
          <select id="fYears"><option value="" disabled selected>Choose</option><option>Less than 1 year</option><option>1–3 years</option><option>4–7 years</option><option>8+ years</option></select></div>
        <div class="form-group"><label for="fBio">About their work</label>
          <textarea id="fBio" rows="4" maxlength="600" placeholder="What they do, what they are good at"></textarea></div>
        <div class="form-group"><label>Photos of their work <span class="optional">3 or more is best</span></label>
          <input type="file" id="fPhotos" accept="image/*" multiple>
          <div class="photo-grid" id="previews"></div></div>
        <button type="submit" class="btn btn-primary" id="addBtn">Add artisan</button>
      </form>
    </section>

    <section id="tabList" class="card" hidden>
      <div id="listBox"></div>
    </section>

    <section id="tabOthers" class="card" hidden>
      <p class="sub" style="margin-bottom:8px;">Every artisan on LifeHub who has not set a password yet. Send them their link so they can open their dashboard and get customers' messages.</p>
      <div id="othersBox"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="onboard.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
